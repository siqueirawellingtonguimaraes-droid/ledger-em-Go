<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LedgerBank</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">

        <div class="header-left">
            <span class="header-label">
                Conta Atual
            </span>

            <h1 id="account-name">
                Conta Principal
            </h1>
        </div>

        <div class="header-center">

            <span class="header-label">
                Chave da Conta
            </span>

            <div class="pix-box">

                <span id="account-id">
                    Nenhuma conta selecionada
                </span>

                <button type="button" id="copy-account-id">
                    Copiar
                </button>

            </div>

        </div>

        <div class="header-right">

            <span class="header-label">
                Selecionar Conta
            </span>

            <select id="account-selector">
            </select>

        </div>

    </header>

    <main class="main-container">

        <section class="stats-grid">

            <div class="stat-card">

                <span>
                    Saldo Atual
                </span>

                <h2 id="account-balance">
                    R$ 0,00
                </h2>

            </div>

            <div class="stat-card">

                <span>
                    Total de Transferências
                </span>

                <h2 id="total-transfers">
                    0
                </h2>

            </div>

        </section>

        <section class="transfer-section">

            <div class="section-header">
                <h3>
                    Nova Transferência
                </h3>
            </div>

            <form id="transfer-form" class="transfer-form">

                <div class="input-group full-width">

                    <label>
                        Descrição
                    </label>

                    <input type="text" id="transaction-description" placeholder="Pagamento interno">

                </div>

                <div class="input-group">

                    <label>
                        Valor
                    </label>

                    <input type="text" id="transaction-amount" placeholder="R$ 0,00">

                </div>

                <div class="input-group">

                    <label>
                        Conta Destino
                    </label>

                    <input type="text" id="destination-account" placeholder="UUID da conta destino">

                </div>

                <button type="submit" class="primary-button full-width-button">
                    Transferir
                </button>

            </form>

        </section>

        <section class="history-section">

            <div class="section-header">
                <h3>
                    Histórico de Transferências
                </h3>
            </div>

            <div class="history-table-wrapper">

                <table>

                    <thead>

                        <tr>
                            <th>Descrição</th>
                            <th>Destino</th>
                            <th>Valor</th>
                            <th>Status</th>
                        </tr>

                    </thead>

                    <tbody id="transactions-table">
                    </tbody>

                </table>

            </div>

        </section>

    </main>

    <button class="floating-button" id="open-account-modal">
        +
    </button>

    <div class="modal-overlay" id="account-modal">

        <div class="modal">

            <div class="modal-header">

                <h3>
                    Criar Conta
                </h3>

                <button type="button" id="close-account-modal">
                    ×
                </button>

            </div>

            <form id="create-account-form">

                <div class="input-group">

                    <label>
                        Nome da Conta
                    </label>

                    <input type="text" id="account-create-name" placeholder="Conta Principal">

                </div>

                <div class="input-group">

                    <label>
                        Moeda
                    </label>

                    <select id="account-currency">

                        <option value="BRL">
                            BRL
                        </option>

                    </select>

                </div>

                <button type="submit" class="primary-button full-width-button">
                    Criar Conta
                </button>

            </form>

        </div>

    </div>

    <script src="app.js"></script>

</body>

</html>
