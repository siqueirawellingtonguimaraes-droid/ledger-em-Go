<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contas</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <aside class="sidebar">
        <div class="logo">
            <h1>LedgerBank</h1>
        </div>

        <nav>
            <a href="index.html">Dashboard</a>
            <a href="accounts.html" class="active">Contas</a>
            <a href="transactions.html">Transações</a>
        </nav>
    </aside>

    <main class="main-content">

        <header class="topbar">
            <div>
                <h2>Contas</h2>
                <p>Gerenciamento de contas financeiras</p>
            </div>
        </header>

        <section class="table-section">
            <div class="card table-card">

                <div class="panel-header">
                    <h3>Buscar Conta</h3>
                </div>

                <div class="search-bar">

                    <input
                        type="text"
                        id="search-account-id"
                        placeholder="Digite o UUID da conta"
                    >

                    <button
                        class="primary-button"
                        id="search-account-button"
                        type="button"
                    >
                        Buscar
                    </button>

                </div>

                <div id="account-result">

                   

                </div>

            </div>
        </section>

    </main>

    <script src="./js/app.js"></script>

</body>
</html>
